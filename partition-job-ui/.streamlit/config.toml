[server]
headless = true
enableCORS = true
enableXsrfProtection = true
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = false

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F3F4F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
