[server]
headless = true
enableCORS = true
enableXsrfProtection = true
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = false

# Default appearance for this internal DBA tool.
# Users may still switch Light/Dark from the Streamlit menu ▸ Settings when available.
[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B22"
textColor = "#F0F3F6"
font = "sans serif"
