[server]
headless = true
enableCORS = true
enableXsrfProtection = true
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = false

# Visual system aligned with partition.ops design template (light operate console).
# Users may still switch Light/Dark from the Streamlit menu ▸ Settings when available.
[theme]
base = "light"
primaryColor = "#165dff"
backgroundColor = "#f3f0e9"
secondaryBackgroundColor = "#fbfaf7"
textColor = "#1c2730"
font = "sans serif"
